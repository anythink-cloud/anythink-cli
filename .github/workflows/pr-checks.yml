name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: |
          dotnet restore AnythinkCli.sln
          dotnet restore tests/AnythinkCli.Tests.csproj
          dotnet restore tests-mcp/AnythinkMcp.Tests.csproj

      - name: Build (warnings visible)
        run: dotnet build AnythinkCli.sln -c Release --no-restore -warnaserror:false

      - name: Test — AnythinkCli.Tests
        id: test_cli
        run: |
          set -o pipefail
          dotnet test tests/AnythinkCli.Tests.csproj -c Release --no-restore \
            --logger "trx;LogFileName=anythinkcli-tests.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory "${{ runner.temp }}/TestResults/cli" \
            2>&1 | tee "${{ runner.temp }}/cli-tests.log"

      - name: Test — AnythinkMcp.Tests (tests-mcp)
        id: test_tests_mcp
        run: |
          set -o pipefail
          dotnet test tests-mcp/AnythinkMcp.Tests.csproj -c Release --no-restore \
            --logger "trx;LogFileName=tests-mcp.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory "${{ runner.temp }}/TestResults/tests-mcp" \
            2>&1 | tee "${{ runner.temp }}/tests-mcp.log"

      - name: Test — AnythinkMcp.Tests (mcp-tests)
        id: test_mcp_tests
        run: |
          set -o pipefail
          dotnet test mcp-tests/AnythinkMcp.Tests.csproj -c Release --no-restore \
            --logger "trx;LogFileName=mcp-tests.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory "${{ runner.temp }}/TestResults/mcp-tests" \
            2>&1 | tee "${{ runner.temp }}/mcp-tests.log"

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test results — ${{ matrix.os }}"
            echo
            for pair in "AnythinkCli.Tests:cli-tests" "tests-mcp:tests-mcp" "mcp-tests:mcp-tests"; do
              project="${pair%%:*}"
              log="${pair##*:}"
              echo "### ${project}"
              echo '```'
              logfile="${{ runner.temp }}/${log}.log"
              if [ -f "$logfile" ]; then
                grep -E "Passed!|Failed!|error FAILED|Total tests:" "$logfile" || echo "(no summary line found — see full log in the job output)"
              else
                echo "(log not found — step may not have run)"
              fi
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TRX test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/TestResults/**/*.trx
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: ${{ runner.temp }}/TestResults/**/coverage.cobertura.xml
          retention-days: 14

  format:
    name: Format (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: |
          dotnet restore AnythinkCli.sln
          dotnet restore tests/AnythinkCli.Tests.csproj
          dotnet restore tests-mcp/AnythinkMcp.Tests.csproj

      - name: Find changed .cs files per project
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.cs' > "${{ runner.temp }}/changed.txt" || true
          echo "Changed .cs files:"
          cat "${{ runner.temp }}/changed.txt"

      - name: dotnet format --verify-no-changes (per project, changed files only)
        shell: bash
        run: |
          set -e
          declare -A PROJECTS=(
            [src/]=src/AnythinkCli.csproj
            [mcp/]=mcp/AnythinkMcp.csproj
            [tests/]=tests/AnythinkCli.Tests.csproj
            [tests-mcp/]=tests-mcp/AnythinkMcp.Tests.csproj
            [mcp-tests/]=mcp-tests/AnythinkMcp.Tests.csproj
          )
          failed=0
          for prefix in "${!PROJECTS[@]}"; do
            proj="${PROJECTS[$prefix]}"
            mapfile -t files < <(grep "^${prefix}" "${{ runner.temp }}/changed.txt" || true)
            if [ "${#files[@]}" -eq 0 ]; then
              continue
            fi
            echo "::group::dotnet format $proj"
            printf '%s\n' "${files[@]}"
            if ! dotnet format "$proj" --no-restore --verify-no-changes --include "${files[@]}"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::dotnet format found issues in files changed by this PR. Run 'dotnet format <project> --include <file>' locally and commit the result."
            exit 1
          fi

  hygiene:
    name: Public-repo hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene script's own tests
        run: node --test scripts/ci/check-public-hygiene.test.js

      - name: Check added lines for internal names / secrets
        env:
          PUBLIC_HYGIENE_PATTERNS: ${{ secrets.PUBLIC_HYGIENE_PATTERNS }}
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | node scripts/ci/check-public-hygiene.js -

  mcp:
    name: MCP server (build, pack, conformance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build MCP server
        run: dotnet build mcp/AnythinkMcp.csproj -c Release

      - name: Pack dotnet tool (anythink-mcp)
        run: dotnet pack mcp/AnythinkMcp.csproj -c Release -o "${{ runner.temp }}/nupkg"

      - name: Pack CLI dotnet tool (anythink)
        run: dotnet pack src/AnythinkCli.csproj -c Release -o "${{ runner.temp }}/nupkg"

      - name: npm pack --dry-run (anythink-mcp wrapper)
        working-directory: npm
        run: npm pack --dry-run

  all-checks:
    name: All PR checks passed
    runs-on: ubuntu-latest
    needs: [test, format, hygiene, mcp]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more PR checks failed."
            exit 1
          fi
          echo "All PR checks passed."
