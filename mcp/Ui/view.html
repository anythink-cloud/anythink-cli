<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anythink</title>
<style>
html,body{margin:0;height:100%;background:#0b0b10;color:#e8e8ee;font:14px system-ui,sans-serif}
#root{height:100%;position:relative}
iframe{display:block;width:100%;height:100%;border:0}
.panel{height:100%;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.panel p{margin:0;color:#a0a0b0}
button{font:inherit;border:0;border-radius:8px;padding:8px 16px;background:#6d5efc;color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.expand{position:absolute;top:8px;right:8px;background:#1b1b26;color:#e8e8ee;border:1px solid #2a2a38}
.skeleton{height:100%;background:linear-gradient(90deg,#14141c 25%,#1b1b26 50%,#14141c 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="root"><div class="skeleton"></div></div>
<script>/*VIEW_JS*/</script>
</body>
</html>
